name: Build and deploy sanitized upstream dashboard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_SHA: fe8c5bc591716aafd79b4765549328f08ef5a52e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public map
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate sanitized graph
        run: npm test
      - name: Checkout pinned Understand Anything
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Egonex-AI/Understand-Anything
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
          persist-credentials: false
      - name: Apply public-static dashboard patch
        run: git -C upstream apply --check ../patches/public-static-dashboard.patch && git -C upstream apply ../patches/public-static-dashboard.patch
      - name: Install pinned dependencies
        working-directory: upstream
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build dashboard
        run: |
          cp data/knowledge-graph.json upstream/understand-anything-plugin/packages/dashboard/public/knowledge-graph.json
          pnpm --dir upstream --filter @understand-anything/dashboard build:demo
      - name: Verify public artifact
        run: |
          test -f upstream/understand-anything-plugin/packages/dashboard/dist/index.html
          cmp data/knowledge-graph.json upstream/understand-anything-plugin/packages/dashboard/dist/knowledge-graph.json
          grep -q '/Findesk-architecture-map/assets/' upstream/understand-anything-plugin/packages/dashboard/dist/index.html
          ! find upstream/understand-anything-plugin/packages/dashboard/dist/assets -type f -name '*CodeViewer*' | grep -q .
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: upstream/understand-anything-plugin/packages/dashboard/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
